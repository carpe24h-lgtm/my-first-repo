<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173653"><meta name="description" content="메디컬빌딩 주차요금 계산기">
<title>메디컬빌딩 주차장 주차요금 계산기</title>
<style>
:root{--navy:#173653;--blue:#2864a5;--green:#18785e;--gold:#d6b66b;--ink:#1d2935;--line:#dce4ec;--bg:#f3f6f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink);padding:14px}.app{max-width:560px;margin:0 auto}
.hero{background:linear-gradient(145deg,#173653,#244f70);color:#fff;border-radius:18px;padding:23px 20px 20px;text-align:center;box-shadow:0 8px 22px #17365324}.eyebrow{font-size:12px;letter-spacing:3px;color:#d7e4ef;font-weight:700}.hero h1{font-size:28px;margin:8px 0 9px;letter-spacing:-1px}.gold{height:2px;width:74px;background:var(--gold);margin:0 auto 10px}.sub{font-size:11px;letter-spacing:2px;color:#d7e4ef}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:14px;box-shadow:0 3px 12px #18334b0a}.section-title{font-size:16px;font-weight:800;margin:0 0 14px;display:flex;align-items:center;gap:8px}.num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#e8eff6;color:var(--navy);font-size:13px}label{font-size:13px;font-weight:700;color:#526273;display:block;margin-bottom:7px}.field{width:100%;border:1px solid #cbd7e2;border-radius:10px;padding:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink);min-height:46px}.vehicle{margin-bottom:14px}.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}.timebox{padding:12px;border-radius:12px}.entry{background:#eaf3ff;border:1px solid #cfe1f8}.exit{background:#e5f5f1;border:1px solid #c9e8df}.timebox label{margin-bottom:8px}.entry label{color:var(--blue)}.exit label{color:var(--green)}.time-select{display:flex;align-items:center;gap:4px}.time-select select{width:100%;min-width:0;border:1px solid #cbd7e2;border-radius:8px;background:#fff;padding:10px 4px;font-size:16px;color:var(--ink)}.colon{font-weight:800}.free-row{display:flex;align-items:center;gap:9px;margin-top:13px;font-size:14px;font-weight:700}.free-row input{width:19px;height:19px;accent-color:var(--navy)}.actions{display:flex;gap:9px;margin-top:14px}.btn{border:0;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:800;cursor:pointer}.btn-primary{background:var(--navy);color:#fff;flex:1}.btn-light{background:#edf1f5;color:#405264}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.result-cell{padding:13px;border-radius:10px;background:#edf5fc}.result-cell span{display:block;color:#637487;font-size:12px;font-weight:700;margin-bottom:6px}.result-cell strong{font-size:18px;color:#244f70;overflow-wrap:anywhere}.amount{margin-top:10px;background:var(--navy);border-radius:12px;padding:16px;text-align:center;color:#fff}.amount span{font-size:13px;color:#d8e4ee}.amount strong{display:block;font-size:30px;margin-top:4px}.breakdown{font-size:12px;color:#617184;margin-top:10px;line-height:1.7}.settings-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.settings-head .section-title{margin:0}.settings-body{margin-top:14px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.settings-grid .field{font-size:15px}.setting-note{font-size:12px;color:#758494;line-height:1.5;margin-top:10px}.lockrow{display:flex;gap:8px;margin-top:12px}.lockrow input{flex:1;min-width:0}.hidden{display:none!important}.foot{text-align:center;color:#8794a1;font-size:11px;padding:18px 5px 8px}@media(max-width:380px){body{padding:9px}.hero h1{font-size:25px}.panel{padding:14px}.timebox{padding:9px}.time-select select{font-size:14px;padding:9px 2px}}
</style>
</head>
<body><main class="app">
<header class="hero"><div class="eyebrow">MEDICAL BUILDING</div><h1>메디컬빌딩 주차장</h1><div class="gold"></div><div class="sub">PARKING FEE CALCULATOR</div></header>
<section class="panel"><h2 class="section-title"><span class="num">1</span> 입·출차 시간 입력</h2>
<div class="vehicle"><label for="vehicle">차량번호</label><input id="vehicle" class="field" type="text" placeholder="예: 12가 3456" autocomplete="off"></div>
<div class="times"><div class="timebox entry"><label>입차 시간</label><div class="time-select"><select id="inHour" aria-label="입차 시"></select><span class="colon">:</span><select id="inMinute" aria-label="입차 분"></select></div></div><div class="timebox exit"><label>출차 시간</label><div class="time-select"><select id="outHour" aria-label="출차 시"></select><span class="colon">:</span><select id="outMinute" aria-label="출차 분"></select></div></div></div>
<label class="free-row"><input type="checkbox" id="free"> 무료 주차 적용</label><div class="actions"><button class="btn btn-primary" id="calculate">주차요금 계산</button><button class="btn btn-light" id="reset">초기화</button></div></section>
<section class="panel"><h2 class="section-title"><span class="num">2</span> 주차요금 결과</h2><div class="result-grid"><div class="result-cell"><span>총 주차시간</span><strong id="duration">0시간 00분</strong></div><div class="result-cell"><span>기본요금</span><strong id="baseResult">0원</strong></div><div class="result-cell"><span>추가요금</span><strong id="extraResult">0원</strong></div><div class="result-cell"><span>차량번호</span><strong id="vehicleResult">-</strong></div></div><div class="amount"><span>최종 결제 주차요금</span><strong id="total">0원</strong></div><div class="breakdown" id="detail">입차 및 출차 시간을 입력한 후 계산 버튼을 눌러주세요.</div></section>
<section class="panel"><div class="settings-head"><h2 class="section-title"><span class="num">3</span> 주차요금 설정</h2><button class="btn btn-light hidden" id="lockBtn">설정 잠금</button></div>
<div id="locked" class="settings-body"><div class="setting-note">요금 설정을 변경하려면 관리자 비밀번호를 입력하세요.</div><div class="lockrow"><input id="password" class="field" type="password" inputmode="numeric" placeholder="관리자 비밀번호"><button class="btn btn-primary" id="unlock">잠금 해제</button></div><div class="setting-note">초기 관리자 비밀번호: 1041</div></div>
<div id="editable" class="settings-body hidden"><div class="settings-grid"><div><label for="baseMinutes">기본 시간 (분)</label><input class="field" id="baseMinutes" type="number" min="1"></div><div><label for="baseFee">기본 요금 (원)</label><input class="field" id="baseFee" type="number" min="0"></div><div><label for="addMinutes">추가 단위 (분)</label><input class="field" id="addMinutes" type="number" min="1"></div><div><label for="addFee">추가 요금 (원)</label><input class="field" id="addFee" type="number" min="0"></div><div><label for="longMinutes">장기주차 기준 (분)</label><input class="field" id="longMinutes" type="number" min="1"></div><div><label for="longFee">장기주차 정액 (원)</label><input class="field" id="longFee" type="number" min="0"></div><div><label for="roundUnit">요금 반올림 단위 (원)</label><input class="field" id="roundUnit" type="number" min="1"></div></div><div class="actions"><button class="btn btn-primary" id="saveSettings">설정 저장</button><button class="btn btn-light" id="defaultSettings">기본값 복원</button></div><div class="setting-note">설정은 현재 사용 중인 브라우저에만 저장됩니다. 다른 사용자에게 자동 반영되지 않습니다.</div></div></section>
<div class="foot">메디컬빌딩 주차장 · 주차요금 계산기</div></main>
<script>
const defaults={baseMinutes:30,baseFee:2000,addMinutes:15,addFee:1000,longMinutes:480,longFee:20000,roundUnit:100};let settings={...defaults};try{const saved=localStorage.getItem('medicalParkingSettings');if(saved)settings={...defaults,...JSON.parse(saved)}}catch(e){}const $=id=>document.getElementById(id);
function fillTime(id,max){const el=$(id);for(let i=0;i<max;i++){const op=document.createElement('option');op.value=i;op.textContent=String(i).padStart(2,'0');el.appendChild(op)}}['inHour','outHour'].forEach(id=>fillTime(id,24));['inMinute','outMinute'].forEach(id=>fillTime(id,60));function applySettings(){for(const [k,v] of Object.entries(settings))$(k).value=v}applySettings();function won(n){return Math.round(n).toLocaleString('ko-KR')+'원'}
function calculate(){const start=Number($('inHour').value)*60+Number($('inMinute').value),end=Number($('outHour').value)*60+Number($('outMinute').value),mins=(end-start+1440)%1440,free=$('free').checked,long=mins>=Number(settings.longMinutes);const extra=mins>Number(settings.baseMinutes)?Math.round((((mins-Number(settings.baseMinutes))*Number(settings.addFee)/Number(settings.addMinutes))/Number(settings.roundUnit)))*Number(settings.roundUnit):0;const base=mins===0?0:Number(settings.baseFee),total=free?0:(mins===0?0:(long?Number(settings.longFee):base+extra));$('duration').textContent=Math.floor(mins/60)+'시간 '+String(mins%60).padStart(2,'0')+'분';$('baseResult').textContent=won(free||long?0:base);$('extraResult').textContent=won(free||long?0:extra);$('vehicleResult').textContent=$('vehicle').value.trim()||'-';$('total').textContent=won(total);$('detail').textContent=free?'무료 주차가 적용되었습니다.':long?'장기주차 정액요금이 적용되었습니다.':mins===0?'주차시간이 0분입니다.':'기본 '+won(base)+' + 추가 '+won(extra)+' 기준으로 계산되었습니다.'}
$('calculate').addEventListener('click',calculate);$('reset').addEventListener('click',()=>{$('vehicle').value='';['inHour','inMinute','outHour','outMinute'].forEach(id=>$(id).value='0');$('free').checked=false;calculate();$('detail').textContent='입차 및 출차 시간을 입력한 후 계산 버튼을 눌러주세요.'});function lock(){ $('locked').classList.remove('hidden');$('editable').classList.add('hidden');$('password').value='';$('lockBtn').classList.add('hidden')}$('unlock').addEventListener('click',()=>{if($('password').value==='1041'){$('locked').classList.add('hidden');$('editable').classList.remove('hidden');$('lockBtn').classList.remove('hidden')}else alert('비밀번호가 올바르지 않습니다.')});$('lockBtn').addEventListener('click',lock);
$('saveSettings').addEventListener('click',()=>{const next={};for(const k of Object.keys(defaults)){const v=Number($(k).value);if(!Number.isFinite(v)||v<0||(!['baseFee','addFee','longFee'].includes(k)&&v===0)){alert('요금 설정값을 확인해 주세요.');return}next[k]=v}settings=next;localStorage.setItem('medicalParkingSettings',JSON.stringify(settings));alert('요금 설정이 저장되었습니다.');calculate()});$('defaultSettings').addEventListener('click',()=>{settings={...defaults};applySettings();localStorage.setItem('medicalParkingSettings',JSON.stringify(settings));alert('기본 요금 설정으로 복원되었습니다.');calculate()});calculate();
</script></body></html>
